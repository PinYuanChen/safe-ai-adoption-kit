[project]
name = "safe-ai-adoption-kit"
version = "0.1.0"
description = "Reference kit for adopting AI safely at a traditional company (synthetic data only)."
readme = "CLAUDE.md"
requires-python = ">=3.12"
dependencies = [
    "anthropic==2.3.0",
]

[dependency-groups]
dev = [
    "pytest==9.2.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# No build backend: src/ is put on the path directly, tests/ so helpers like fake_client import cleanly.
pythonpath = ["src", "tests"]
addopts = ["-ra", "--strict-markers", "--strict-config"]
