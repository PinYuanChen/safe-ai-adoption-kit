# Server-side secret scan. The local pre-commit hook can be skipped, so every
# push and pull request is scanned here too, across the full history.
name: secret-scan

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan full history with gitleaks
        # Use gitleaks' built-in rules only: a committed .gitleaks.toml or
        # .gitleaksignore could otherwise silence findings.
        run: |
          # Inline "gitleaks:allow" comments also silence findings; refuse them.
          if git log -p --all | grep -q "gitleaks:allow"; then
            echo "::error::A commit contains a gitleaks:allow comment."
            exit 1
          fi
          rm -f .gitleaks.toml .gitleaksignore
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.30.1 \
            git /repo --redact --no-banner --exit-code 1
